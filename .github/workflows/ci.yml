name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.17.0'

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Wait for MongoDB
        run: |
          for i in {1..60}; do
            if mongo "mongodb://localhost:27017" --eval "db.stats()" > /dev/null 2>&1; then
              echo "MongoDB is ready!"
              exit 0
            fi
            echo "Waiting for MongoDB..."
            sleep 2
          done
          echo "MongoDB did not become ready in time!"
          exit 1

      ### === BACKEND ===
      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install

      - name: Run backend unit tests
        working-directory: backend
        env:
          PORT: 3000
          NODE_ENV: test
          DB_TEST: "mongodb://localhost:27017/graduationproject_test"
        run: ~/.bun/bin/bun test

      - name: Run backend e2e tests
        working-directory: backend
        env:
          PORT: 3000
          NODE_ENV: test
          DB_TEST: "mongodb://localhost:27017/graduationproject_test"
        run: ~/.bun/bin/bun test:e2e

      - name: Build backend Docker image
        working-directory: backend
        run: docker build -t recipiore-backend:latest .

      ### === FRONTEND ===

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Lint frontend code
        working-directory: frontend
        run: pnpm run lint

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Build frontend Docker image
        working-directory: frontend
        run: docker build -t recipiore-frontend:latest .
