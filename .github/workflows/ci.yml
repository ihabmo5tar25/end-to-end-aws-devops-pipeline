name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.17.0'

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install

      - name: Run backend unit tests
        working-directory: backend
        env:
          PORT: 3000
          NODE_ENV: test
          DB_TEST: "mongodb://localhost:27017/graduationproject_test"
        run: bun test

      - name: Run backend e2e tests
        working-directory: backend
        env:
          PORT: 3000
          NODE_ENV: test
          DB_TEST: "mongodb://localhost:27017/graduationproject_test"
        run: bun test:e2e

      - name: Build backend Docker image
        working-directory: backend
        run: docker build -t recipiore-backend:latest .

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend Docker image to Docker Hub
        working-directory: backend
        run: |
          docker tag recipiore-backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/recipiore-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/recipiore-backend:latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Lint frontend code
        working-directory: frontend
        run: pnpm run lint

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Build frontend Docker image
        working-directory: frontend
        run: docker build -t recipiore-frontend:latest .

      - name: Push frontend Docker image to Docker Hub
        working-directory: frontend
        run: |
          docker tag recipiore-frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/recipiore-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/recipiore-frontend:latest
